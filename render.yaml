# Render Blueprint - deploy from repo root
# After connecting this repo in Render Dashboard, add env vars from .env.example
services:
  - type: web
    runtime: node
    name: stock-pattern-stream
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production

  - type: cron
    name: refresh-daily-bars
    runtime: node
    plan: starter
    schedule: "30 21 * * 1-5"
    buildCommand: npm install
    startCommand: npx tsx server/scripts/refreshDailyBars.ts
    envVars:
      - key: NODE_ENV
        value: production
